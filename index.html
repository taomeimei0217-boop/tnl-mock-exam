<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>

  .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .btn { background:var(--main); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:16px; cursor:pointer; }
  .btn:disabled { background:#bbb; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--main); border:2px solid var(--main); }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #e0c4d2; border-radius:10px; padding:10px 14px; margin:8px 0; font-size:16px; cursor:pointer; color:var(--text); }
  .opt:hover { border-color:var(--main); }
  .opt.sel { border-color:var(--main); background:#fce4ec; font-weight:bold; }
  .opt.right { border-color:var(--ok); background:#e8f5e9; }
  .opt.wrong { border-color:var(--bad); background:#ffebee; }
  .qno { color:var(--main); font-weight:bold; }
  .stat { display:flex; justify-content:space-between; font-size:14px; color:#666; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .nav { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
  .big { font-size:48px; font-weight:bold; text-align:center; color:var(--main); }
  .center { text-align:center; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .review-item { border-bottom:1px solid #eee; padding:10px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>TNL 二級美睫師 模擬考</h1>
  <div id="timer">15:00</div>
</header>

<div class="wrap">

  <section id="start" class="card center">
    <h2>模擬考說明</h2>
    <p>隨機抽出 <b>20 題</b>，限時 <b>15 分鐘</b>。</p>
    <p>答對每題 <b>+5 分</b>，答錯不扣分，未作答也不加分。<br>滿分 100 分，<b>60 分及格</b>。</p>
    <p style="color:#777;font-size:14px">作答中可以上一題、下一題來回切換，交卷後可檢視每題對錯。</p>
    <button class="btn" onclick="startExam()">開始考試</button>
  </section>

  <!-- 作答畫面 -->
  <section id="exam" class="hidden">
    <div class="stat">
      <span id="progress"></span>
      <span id="answeredCount"></span>
    </div>
    <div class="card">
      <div id="qArea"></div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" onclick="go(-1)">上一題</button>
      <button class="btn" id="nextBtn" onclick="go(1)">下一題</button>
    </div>
    <div class="center" style="margin-top:20px">
      <button class="btn" style="background:#6a1b9a" onclick="confirmSubmit()">交卷</button>
    </div>
  </section>

  <!-- 結果畫面 -->
  <section id="result" class="hidden">
    <div class="card center">
      <div class="big" id="scoreBig"></div>
      <p id="resultMsg" style="font-size:20px;font-weight:bold"></p>
      <p id="resultDetail"></p>
      <button class="btn" onclick="location.reload()">重新測驗</button>
    </div>
    <div class="card">
      <h3>作答檢視</h3>
      <div id="reviewArea"></div>
    </div>
  </section>
</div>

const EXAM_COUNT = 20;
const TIME_LIMIT = 15 * 60;
const PER_RIGHT = 5, PER_WRONG = 0, PASS = 60;

let questions = [], answers = [], cur = 0, timeLeft = TIME_LIMIT, timerId = null, finished = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startExam() {
  const picked = shuffle(BANK).slice(0, EXAM_COUNT).map(item => {
    // 打亂選項順序，並記住新的正確答案位置
    const idxs = shuffle([0,1,2,3]);
    const opts = idxs.map(i => item.o[i]);
    const correct = idxs.indexOf(item.a - 1) + 1;
    return { q: item.q, o: opts, a: correct };
  });
  questions = picked;
  answers = new Array(EXAM_COUNT).fill(null);
  cur = 0;
  timeLeft = TIME_LIMIT;
  finished = false;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('exam').classList.remove('hidden');
  render();
  updateTimer();
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      alert('時間到，自動交卷！');
      submitExam();
    }
  }, 1000);
}

function updateTimer() {
  const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  el.style.color = timeLeft <= 60 ? '#ffeb3b' : '#fff';
}

function render() {
  const q = questions[cur];
  document.getElementById('progress').textContent = `第 ${cur+1} / ${EXAM_COUNT} 題`;
  const answered = answers.filter(x => x !== null).length;
  document.getElementById('answeredCount').textContent = `已作答 ${answered} 題`;
  let html = `<div class="qno">第 ${cur+1} 題</div><p style="font-size:17px">${q.q}</p>`;
  q.o.forEach((opt, i) => {
    const sel = answers[cur] === i+1 ? ' sel' : '';
    html += `<button class="opt${sel}" onclick="choose(${i+1})">(${i+1}) ${opt}</button>`;
  });
  document.getElementById('qArea').innerHTML = html;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === EXAM_COUNT - 1;
}

function choose(n) {
  answers[cur] = n;
  render();
}

function go(d) {
  cur = Math.min(EXAM_COUNT-1, Math.max(0, cur + d));
  render();
}

function confirmSubmit() {
  const unanswered = answers.filter(x => x === null).length;
  let msg = '確定交卷？';
  if (unanswered > 0) msg = `還有 ${unanswered} 題未作答（未作答不加分），確定交卷？`;
  if (confirm(msg)) submitExam();
}

function submitExam() {
  if (finished) return;
  finished = true;
  clearInterval(timerId);
  let right = 0, wrong = 0;
  questions.forEach((q, i) => {
    if (answers[i] === null) return;
    if (answers[i] === q.a) right++; else wrong++;
  });
  let score = right * PER_RIGHT + wrong * PER_WRONG;
  if (score < 0) score = 0;
  if (score > 100) score = 100;
  const unanswered = EXAM_COUNT - right - wrong;

  document.getElementById('exam').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('scoreBig').textContent = score + ' 分';
  const passed = score >= PASS;
  const msgEl = document.getElementById('resultMsg');
  msgEl.textContent = passed ? '恭喜，及格！' : '未及格，請再複習';
  msgEl.className = passed ? 'pass' : 'fail';
  document.getElementById('resultDetail').textContent =
    `答對 ${right} 題、答錯 ${wrong} 題、未作答 ${unanswered} 題（使用時間 ${formatUsed()}）`;

  let rev = '';
  questions.forEach((q, i) => {
    const my = answers[i];
    const status = my === null ? '未作答' : (my === q.a ? '✔ 答對' : '✘ 答錯');
    const color = my === null ? '#777' : (my === q.a ? 'var(--ok)' : 'var(--bad)');
    rev += `<div class="review-item"><div><span class="qno">第 ${i+1} 題</span> <span style="color:${color};font-weight:bold">${status}</span></div>`;
    rev += `<div>${q.q}</div>`;
    if (my !== null && my !== q.a) rev += `<div style="color:var(--bad)">你的答案：(${my}) ${q.o[my-1]}</div>`;
    rev += `<div style="color:var(--ok)">正確答案：(${q.a}) ${q.o[q.a-1]}</div></div>`;
  });
  document.getElementById('reviewArea').innerHTML = rev;
  window.scrollTo(0,0);
}

function formatUsed() {
  const used = TIME_LIMIT - timeLeft;
  return Math.floor(used/60) + ' 分 ' + (used%60) + ' 秒';
}
</script>
